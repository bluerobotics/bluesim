name: Godot exports

on: [push, pull_request]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install Godot and export templates
        shell: bash
        run: |
          release="${GODOT_VERSION}-stable"
          base="https://github.com/godotengine/godot-builds/releases/download/${release}"
          tools="${RUNNER_TEMP}/bluesim-tools"
          templates="${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tools" "$templates"
          curl -fsSL --retry 3 "$base/Godot_v${release}_linux.x86_64.zip" -o "$tools/godot.zip"
          curl -fsSL --retry 3 "$base/Godot_v${release}_export_templates.tpz" -o "$tools/templates.tpz"
          unzip -q "$tools/godot.zip" -d "$tools"
          mv "$tools/Godot_v${release}_linux.x86_64" "$tools/godot"
          unzip -jq "$tools/templates.tpz" 'templates/version.txt' 'templates/windows_release_x86_64*' 'templates/linux_release.x86_64' 'templates/macos.zip' 'templates/web_nothreads_release.zip' -d "$templates"
          echo "$tools" >> "$GITHUB_PATH"
      - name: Import project
        shell: bash
        run: |
          godot --headless --editor --import 2>&1 | tee "$RUNNER_TEMP/bluesim-import.log"
          if grep -E '(^|[[:space:]])(SCRIPT ERROR|SHADER ERROR|ERROR):' "$RUNNER_TEMP/bluesim-import.log"; then
            exit 1
          fi
      - name: Test SITL transport
        run: godot --headless --script res://tests/sitl_smoke.gd
      - name: Export release artifacts
        run: bash .github/export.sh godot "$RUNNER_TEMP/bluesim-exports"
      - uses: actions/upload-artifact@v7
        with:
          name: bluesim-exports
          path: |
            ${{ runner.temp }}/bluesim-exports/bluesim-linux.zip
            ${{ runner.temp }}/bluesim-exports/bluesim-mac.zip
            ${{ runner.temp }}/bluesim-exports/bluesim-web.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bluesim-windows
          path: ${{ runner.temp }}/bluesim-exports/bluesim-windows.zip
          if-no-files-found: error

  windows-startup:
    needs: export
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bluesim-windows
      - name: Launch Windows release
        shell: pwsh
        run: |
          Expand-Archive bluesim-windows.zip -DestinationPath bluesim
          Push-Location bluesim
          $app = Start-Process -FilePath ".\bluesim.exe" -ArgumentList "--headless", "--quit-after", "90", "--log-file", "startup.log" -Wait -PassThru
          Get-Content startup.log
          if ($app.ExitCode -ne 0 -or (Select-String -Path startup.log -Pattern "SCRIPT ERROR|SHADER ERROR")) {
            throw "BlueSim Windows startup failed."
          }
          Pop-Location
