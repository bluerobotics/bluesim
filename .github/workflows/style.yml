name: GDScript style

on: [push, pull_request]

permissions:
  contents: read

jobs:
  gdformat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install gdtoolkit==4.5.0
      - run: git ls-files -z '*.gd' | xargs -0 gdformat --check
